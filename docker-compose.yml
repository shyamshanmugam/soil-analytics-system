services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
